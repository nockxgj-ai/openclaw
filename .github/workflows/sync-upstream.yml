name: sync-upstream

# Keep this mirror in step with the upstream project. First run with no recorded
# commit imports the whole tree; later runs apply the newest upstream commit and
# keep its author and date, so the history reads like the real project. The
# workflow directory is never copied, so the mirror keeps its own automation.
on:
  schedule:
    - cron: '42 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply upstream changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM: openclaw/openclaw
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import io
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import tarfile
          import urllib.error
          import urllib.parse
          import urllib.request

          TOKEN = os.environ["GITHUB_TOKEN"]
          UPSTREAM = os.environ["UPSTREAM"]
          REF_NAME = os.environ.get("REF_NAME") or "main"
          MAX_BYTES = 1048576
          API = "https://api.github.com"
          SHA_FILE = pathlib.Path(".upstream-sha")

          def gh(url, accept="application/vnd.github+json"):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": accept,
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "sync-upstream",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      return resp.read()
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return None
                  raise

          def is_reserved(path):
              return path == ".github" or path.startswith(".github/") or path == ".upstream-sha"

          def remove(path):
              p = pathlib.Path(path)
              if p.is_file() or p.is_symlink():
                  p.unlink()

          def git(*args, extra_env=None):
              env = os.environ.copy()
              if extra_env:
                  env.update(extra_env)
              subprocess.check_call(["git", *args], env=env)

          repo_raw = gh(f"{API}/repos/{UPSTREAM}")
          if not repo_raw:
              sys.exit(f"cannot read {UPSTREAM}")
          default_branch = json.loads(repo_raw).get("default_branch") or "main"

          payload = gh(f"{API}/repos/{UPSTREAM}/commits/{default_branch}")
          if not payload:
              sys.exit("cannot read latest upstream commit")
          commit = json.loads(payload)
          sha = commit.get("sha") or ""
          if not sha:
              sys.exit("latest upstream commit has no sha")
          if SHA_FILE.is_file() and SHA_FILE.read_text(encoding="utf-8").strip() == sha:
              print(f"already at {sha}")
              sys.exit(0)

          seeded = SHA_FILE.is_file()
          if not seeded:
              # First run: lay down the whole tree from a tarball snapshot.
              tar_bytes = gh(f"{API}/repos/{UPSTREAM}/tarball/{sha}", accept="application/vnd.github.raw")
              if tar_bytes is None:
                  sys.exit("cannot download upstream tarball")
              with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode="r:gz") as tar:
                  for member in tar.getmembers():
                      # Each real entry is "<top-dir>/<path>"; strip its own first segment. A
                      # leading pax_global_header (no slash) yields an empty rel and is skipped,
                      # so no shared-root guess is needed.
                      parts = member.name.split("/", 1)
                      rel = parts[1] if len(parts) > 1 else ""
                      if not rel or is_reserved(rel):
                          continue
                      if member.isdir():
                          pathlib.Path(rel).mkdir(parents=True, exist_ok=True)
                          continue
                      if not member.isfile():
                          continue
                      src = tar.extractfile(member)
                      if src is None:
                          continue
                      dest = pathlib.Path(rel)
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(src.read())
          else:
              # Later runs: apply just the files the newest commit touched.
              for item in commit.get("files") or []:
                  name = item.get("filename") or ""
                  prev = item.get("previous_filename") or ""
                  if not name or is_reserved(name) or (prev and is_reserved(prev)):
                      continue
                  status = item.get("status") or ""
                  if status == "removed":
                      remove(name)
                      continue
                  if status == "renamed" and prev:
                      remove(prev)
                  encoded = urllib.parse.quote(name, safe="/")
                  meta_raw = gh(f"{API}/repos/{UPSTREAM}/contents/{encoded}?ref={sha}")
                  if not meta_raw:
                      print(f"skip missing {name}")
                      continue
                  meta = json.loads(meta_raw)
                  if meta.get("type") != "file":
                      continue
                  size = int(meta.get("size") or 0)
                  if size > MAX_BYTES:
                      print(f"skip large {name} ({size})")
                      continue
                  raw = gh(
                      f"{API}/repos/{UPSTREAM}/contents/{encoded}?ref={sha}",
                      accept="application/vnd.github.raw",
                  )
                  if raw is None:
                      print(f"skip download {name}")
                      continue
                  dest = pathlib.Path(name)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(raw)

          SHA_FILE.write_text(sha + "\n", encoding="utf-8")
          git("add", "-A")
          if subprocess.call(["git", "diff", "--cached", "--quiet"]) == 0:
              print("no changes")
              sys.exit(0)

          info = commit.get("commit") or {}
          author = info.get("author") or {}
          committer = info.get("committer") or {}
          message = info.get("message") or sha
          extra = {
              "GIT_AUTHOR_NAME": author.get("name") or "unknown",
              "GIT_AUTHOR_EMAIL": author.get("email") or "unknown@users.noreply.github.com",
              "GIT_AUTHOR_DATE": author.get("date") or "",
              "GIT_COMMITTER_NAME": committer.get("name") or author.get("name") or "unknown",
              "GIT_COMMITTER_EMAIL": committer.get("email") or author.get("email") or "unknown@users.noreply.github.com",
              "GIT_COMMITTER_DATE": committer.get("date") or author.get("date") or "",
          }
          extra = {k: v for k, v in extra.items() if v}
          pathlib.Path("/tmp/upstream-commit-msg").write_text(message, encoding="utf-8")
          git("commit", "--no-gpg-sign", "-F", "/tmp/upstream-commit-msg", extra_env=extra)
          try:
              git("push")
          except subprocess.CalledProcessError:
              git("pull", "--rebase", "origin", REF_NAME)
              git("push")
          PY
